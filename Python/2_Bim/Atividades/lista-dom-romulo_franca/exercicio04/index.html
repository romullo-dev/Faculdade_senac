<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Lista de participantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Lista de participantes</h1>

        <label for="participante">Nome do participante</label>
        <input type="text" id="participante" placeholder="Digite o nome">

        <button type="button" id="botao-adicionar">Adicionar participante</button>

        <p id="mensagem"></p>

        <p>Participantes cadastrados: <strong id="contador">0</strong></p>
        <ul id="lista-participantes" class="lista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>

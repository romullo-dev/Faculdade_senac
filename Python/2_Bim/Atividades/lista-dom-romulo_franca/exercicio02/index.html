<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Calculadora de compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Calculadora de compra</h1>

        <label for="produto">Nome do produto</label>
        <input type="text" id="produto" placeholder="Ex.: Caderno">

        <label for="preco">Preço unitário (R$)</label>
        <input type="number" id="preco" step="0.01" placeholder="Ex.: 25.50">

        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" step="1" placeholder="Ex.: 3">

        <button type="button" id="botao-calcular">Calcular compra</button>

        <p id="mensagem"></p>
        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>

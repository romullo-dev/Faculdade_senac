<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Situação acadêmica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Situação acadêmica</h1>

        <label for="estudante">Nome do estudante</label>
        <input type="text" id="estudante" placeholder="Ex.: Ana Souza">

        <label for="nota1">Primeira nota</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0 a 10">

        <label for="nota2">Segunda nota</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0 a 10">

        <button type="button" id="botao-verificar">Verificar situação</button>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>

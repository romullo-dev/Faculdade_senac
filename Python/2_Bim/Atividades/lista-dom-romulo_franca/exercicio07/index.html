<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7 - Pedido de lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Pedido de lanchonete</h1>

        <label for="nome">Nome do item</label>
        <input type="text" id="nome" placeholder="Ex.: X-Salada">

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" placeholder="Ex.: 18.90">

        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" step="1" placeholder="Ex.: 2">

        <button type="button" id="botao-adicionar">Adicionar ao pedido</button>
        <button type="button" id="botao-limpar" class="botao-limpar">Limpar pedido</button>

        <p id="mensagem"></p>

        <div class="resumo">
            <p>Total de unidades: <strong id="total-unidades">0</strong></p>
            <p>Valor total do pedido: <strong id="valor-pedido">R$ 0.00</strong></p>
        </div>

        <ul id="lista-itens" class="lista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>

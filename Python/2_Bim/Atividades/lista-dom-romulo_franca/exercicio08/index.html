<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8 - Painel de atendimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Painel de atendimento</h1>

        <label for="nome">Nome do paciente</label>
        <input type="text" id="nome" placeholder="Ex.: João Silva">

        <label for="idade">Idade</label>
        <input type="number" id="idade" step="1" placeholder="Ex.: 45">

        <label for="tipo">Tipo de atendimento</label>
        <select id="tipo">
            <option value="Normal">Normal</option>
            <option value="Prioritário">Prioritário</option>
        </select>

        <button type="button" id="botao-cadastrar">Cadastrar paciente</button>

        <p id="mensagem"></p>

        <div class="resumo">
            <p>Total de pacientes: <strong id="total-pacientes">0</strong></p>
            <p>Atendimentos prioritários: <strong id="total-prioritarios">0</strong></p>
        </div>

        <ul id="fila" class="lista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>

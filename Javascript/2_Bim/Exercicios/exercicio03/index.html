<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Exercício 3 — Situação acadêmica</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<h1>Exercício 3 — Situação acadêmica</h1>

		<label for="aluno">Nome do estudante</label>
		<input id="aluno" type="text">

		<label for="nota1">Primeira nota</label>
		<input id="nota1" type="number" min="0" max="10" step="0.01">

		<label for="nota2">Segunda nota</label>
		<input id="nota2" type="number" min="0" max="10" step="0.01">

		<div>
			<button id="verificar" type="button">Verificar situação</button>
		</div>

		<p id="mensagem" aria-live="polite"></p>
		<p id="resultado" aria-live="polite"></p>
	</main>

	<script src="script.js"></script>
</body>
</html>
